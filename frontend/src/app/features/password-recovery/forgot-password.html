<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="recovery-title">
    <img class="logo" src="/img/logo-sviluppo-personale.png" alt="Sviluppo Personale">
    <h1 id="recovery-title">Password dimenticata?</h1>
    <p>Inserisci la tua email per ricevere le istruzioni di recupero.</p>
    <form (ngSubmit)="invia()" [attr.aria-busy]="caricamento()">
      <label for="recovery-email">Email</label>
      <input id="recovery-email" name="email" type="email" autocomplete="email"
        [(ngModel)]="email" required [disabled]="caricamento()">
      <button type="submit" [disabled]="caricamento()">
        {{ caricamento() ? 'Invio in corso...' : 'Invia istruzioni' }}
      </button>
    </form>
    @if (errore()) { <p class="error" role="alert">{{ errore() }}</p> }
    @if (messaggio()) { <p class="success" role="status">{{ messaggio() }}</p> }
    <a routerLink="/login">Torna alla login</a>
  </section>
</main>
