<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="reset-title">
    <img class="logo" src="/img/logo-sviluppo-personale.png" alt="Sviluppo Personale">
    <h1 id="reset-title">Reimposta password</h1>
    @if (!linkNonValido()) {
      <p>Scegli una nuova password di almeno 8 caratteri.</p>
      <form (ngSubmit)="aggiorna()" [attr.aria-busy]="caricamento()">
        <label for="new-password">Nuova password</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password"
          [(ngModel)]="password" required minlength="8" [disabled]="caricamento()">
        <label for="confirm-password">Conferma password</label>
        <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password"
          [(ngModel)]="confirmation" required minlength="8" [disabled]="caricamento()">
        <button type="submit" [disabled]="caricamento()">
          {{ caricamento() ? 'Aggiornamento in corso...' : 'Aggiorna password' }}
        </button>
      </form>
    }
    @if (errore()) { <p class="error" role="alert">{{ errore() }}</p> }
    <a routerLink="/forgot-password">Richiedi un nuovo link</a>
    <a routerLink="/login">Torna alla login</a>
  </section>
</main>
