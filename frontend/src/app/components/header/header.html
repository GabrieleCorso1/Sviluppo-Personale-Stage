<header class="topbar">
      <button type="button" class="header-button mobile-menu-toggle" aria-label="Apri menu di navigazione"
        aria-controls="primary-navigation" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu.emit()">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <div class="page-heading">
        <span [title]="pageTitle()">{{ pageTitle() }}</span>
        <i class="bi bi-info-circle"></i>
      </div>

      <div class="topbar-actions">
        <app-theme-picker />
        <div class="notification-bell">
          <button #bell type="button" class="header-button bell-button"
            [attr.aria-label]="unreadCount() ? 'Notifiche non lette: ' + unreadCount() : 'Notifiche'"
            [attr.aria-expanded]="notificationsOpen()" (click)="notificationsOpen.set(!notificationsOpen())"
            (keydown.escape)="notificationsOpen.set(false)">
            <i class="bi bi-bell" aria-hidden="true"></i>
            @if (unreadCount(); as count) {
              <span class="notification-badge" aria-hidden="true">{{ count > 99 ? '99+' : count }}</span>
            }
          </button>
          @if (notificationsOpen()) {
            <div class="notification-popover" (keydown.escape)="closeFromPreview($event, bell)">
              <app-notification-list [preview]="true" (dismiss)="notificationsOpen.set(false)" />
            </div>
          }
        </div>
        @if (canAccessSettings()) {
          <button
            type="button"
            class="header-button"
            aria-label="Impostazioni"
            (click)="openSettings.emit()"
          >
            <i class="bi bi-gear"></i>
          </button>
        }
        <div class="account-menu" (focusout)="closeAccountOnBlur($event)"
          (keydown.escape)="closeAccount(true); $event.stopPropagation()">
          <button type="button" class="avatar avatar-button" aria-label="Apri menu account"
            aria-controls="account-options" [attr.aria-expanded]="accountOpen()" (click)="toggleAccount()">
            @if (avatarUrl(); as photo) {
              <img class="avatar-photo" [src]="photo" alt="" />
            } @else { U }
          </button>
          @if (accountOpen()) {
            <div id="account-options" class="account-popover" role="group" aria-label="Menu account" [attr.aria-busy]="loggingOut()">
              @if (auth.currentUser(); as user) {
                <p class="account-name">{{ user.first_name }} {{ user.last_name }}</p>
              }
              <div class="account-actions">
                <button type="button" class="account-profile" [disabled]="loggingOut()" (click)="goToProfile()">
                  <i class="bi bi-person-circle" aria-hidden="true"></i> Vai al profilo
                </button>
                <button type="button" class="account-logout" [disabled]="loggingOut()" (click)="logout()">
                  <i class="bi bi-box-arrow-right" aria-hidden="true"></i> {{ loggingOut() ? 'Uscita in corso…' : 'Esci' }}
                </button>
              </div>
              @if (accountError()) { <p class="account-error" role="alert">{{ accountError() }}</p> }
            </div>
          }
        </div>
      </div>
    </header>
