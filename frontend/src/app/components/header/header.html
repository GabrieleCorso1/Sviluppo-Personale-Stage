<header class="topbar">
      <div class="page-heading">
        <span>{{ pageTitle() }}</span>
        <i class="bi bi-info-circle"></i>
      </div>

      <div class="topbar-actions">
        <div class="notification-bell">
          <button #bell type="button" class="header-button bell-button"
            [attr.aria-label]="unreadCount() ? 'Notifiche non lette: ' + unreadCount() : 'Notifiche'"
            [attr.aria-expanded]="notificationsOpen()" (click)="notificationsOpen.set(!notificationsOpen())"
            (keydown.escape)="notificationsOpen.set(false)">
            <i class="bi bi-bell" aria-hidden="true"></i>
            @if (unreadCount(); as count) {
              <span class="notification-badge" aria-hidden="true">{{ count > 99 ? '99+' : count }}</span>
            }
          </button>
          @if (notificationsOpen()) {
            <div class="notification-popover" (keydown.escape)="closeFromPreview($event, bell)">
              <app-notification-list [preview]="true" (dismiss)="notificationsOpen.set(false)" />
            </div>
          }
        </div>
        @if (canAccessSettings()) {
          <button
            type="button"
            class="header-button"
            aria-label="Impostazioni"
            (click)="openSettings.emit()"
          >
            <i class="bi bi-gear"></i>
          </button>
        }
        @if (avatarUrl(); as photo) {
          @if (avatarEditable()) {
          <button type="button" class="avatar avatar-button" aria-label="Gestisci foto profilo"
            aria-haspopup="dialog" (click)="openAvatar.emit()">
            <img class="avatar-photo" [src]="photo" alt="" />
          </button>
          } @else {
            <a class="avatar avatar-static" routerLink="/home" aria-label="Vai al profilo">
              <img class="avatar-photo" [src]="photo" alt="" />
            </a>
          }
        } @else if (!avatarEditable()) {
          <a class="avatar" routerLink="/home" aria-label="Vai al profilo">U</a>
        } @else {
          <div class="avatar" aria-label="Profilo utente">U</div>
        }
      </div>
    </header>
