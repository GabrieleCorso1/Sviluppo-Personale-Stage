<header class="topbar">
      <div class="page-heading">
        <span>{{ pageTitle() }}</span>
        <i class="bi bi-info-circle"></i>
      </div>

      <div class="topbar-actions">
        <button class="header-button" aria-label="Notifiche">
          <i class="bi bi-bell"></i>
        </button>
        @if (canAccessSettings()) {
          <button
            type="button"
            class="header-button"
            aria-label="Impostazioni"
            (click)="openSettings.emit()"
          >
            <i class="bi bi-gear"></i>
          </button>
        }
        @if (avatarUrl(); as photo) {
          @if (avatarEditable()) {
          <button type="button" class="avatar avatar-button" aria-label="Gestisci foto profilo"
            aria-haspopup="dialog" (click)="openAvatar.emit()">
            <img class="avatar-photo" [src]="photo" alt="" />
          </button>
          } @else {
            <img class="avatar avatar-static" [src]="photo" alt="Foto profilo" />
          }
        } @else {
          <div class="avatar" aria-label="Profilo utente">U</div>
        }
      </div>
    </header>
