<button #trigger type="button" class="theme-trigger" [attr.aria-label]="'Aspetto: ' + label()"
  [attr.aria-expanded]="open()" title="Cambia aspetto" (click)="open.set(!open())">
  <i [class]="'bi bi-' + (theme.preference() === 'system' ? 'display' : theme.effective() === 'dark' ? 'moon-stars' : 'sun')" aria-hidden="true"></i>
</button>
@if (open()) {
  <fieldset class="theme-options">
    <legend>Aspetto</legend>
    @for (choice of choices; track choice.value) {
      <label [class.selected]="theme.preference() === choice.value">
        <input type="radio" name="appearance" [value]="choice.value"
          [checked]="theme.preference() === choice.value" (change)="choose(choice.value)" />
        <i [class]="'bi bi-' + choice.icon" aria-hidden="true"></i>
        <span>{{ choice.label }}</span>
      </label>
    }
    <small>“Sistema” segue il tema del dispositivo.</small>
  </fieldset>
}
